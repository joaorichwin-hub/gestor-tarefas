<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Tarefas · Controladoria · Grupo Café Export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-deep:#1a0f0a; --bg-main:#241611; --bg-card:#2d1b14; --bg-elevated:#3a2318; --bg-input:#1f130d;
  --border-soft:#3a2820; --border-mid:#4a3020; --border-strong:#5a3818;
  --gold-primary:#c8a15c; --gold-bright:#d8b76e; --gold-dim:#8a6a3a;
  --cream:#f5e6c8; --cream-dim:#e8d3a8;
  --text-primary:#e8d3a8; --text-secondary:#a08560; --text-muted:#6a5238;
  --accent-green:#6a8a50; --accent-red:#a54832; --accent-blue:#4a7090; --accent-orange:#c07850;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{background:var(--bg-main);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body{background:linear-gradient(180deg,var(--bg-deep) 0%,var(--bg-main) 480px)}
::selection{background:var(--gold-primary);color:var(--bg-deep)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg-deep)}::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}

/* ===== LAYOUT ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-deep),var(--bg-main));border-right:1px solid var(--border-soft);padding:26px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;padding:40px 48px 100px;max-width:1180px}

/* brand */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:0 8px}
.brand-mark{width:34px;height:34px;background:radial-gradient(circle at 30% 30%,var(--gold-bright),var(--gold-primary) 60%,var(--gold-dim));border-radius:50%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.3),0 0 20px rgba(200,161,92,.15);position:relative;flex-shrink:0}
.brand-mark::after,.brand-mark::before{content:'';position:absolute;top:50%;left:50%;width:15px;height:2px;background:var(--bg-deep);border-radius:1px}
.brand-mark::after{transform:translate(-50%,-50%) rotate(45deg)}
.brand-mark::before{transform:translate(-50%,-50%) rotate(-45deg)}
.brand-logo{width:46px;height:46px;border-radius:50%;flex-shrink:0;box-shadow:0 0 18px rgba(200,161,92,.18)}
.brand-logo svg{display:block;width:100%;height:100%;border-radius:50%}
.brand-text{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--cream);line-height:1.2}
.brand-text span{color:var(--gold-primary);font-style:italic;font-weight:400}
.side-meta{font-size:9.5px;font-weight:600;letter-spacing:.16em;color:var(--text-muted);text-transform:uppercase;padding:0 8px;margin-bottom:18px}

.nav-label{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase;padding:16px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:8px;cursor:pointer;color:var(--text-secondary);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:all .18s var(--ease);position:relative;user-select:none}
.nav-item:hover{background:var(--bg-card);color:var(--cream-dim);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(135deg,var(--bg-elevated),var(--bg-card));color:var(--cream);border-color:var(--border-mid)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--gold-primary);border-radius:0 2px 2px 0}
.nav-ico{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bg-input);color:var(--gold-primary);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-soft)}
.nav-item.active .nav-badge{background:var(--gold-primary);color:var(--bg-deep);border-color:var(--gold-primary)}
.nav-mini{font-size:11px;color:var(--text-muted);margin-left:auto}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border-soft);font-size:10px;color:var(--text-muted);line-height:1.6}
.side-foot b{color:var(--text-secondary);font-weight:600}
.foot-today b{color:var(--gold-primary)}
.side-backup{display:flex;gap:8px;margin-top:10px}
.mini-link{flex:1;background:var(--bg-input);border:1px solid var(--border-soft);color:var(--text-secondary);font-size:10px;font-weight:600;padding:6px 8px;border-radius:6px;cursor:pointer;transition:all .15s var(--ease)}
.mini-link:hover{color:var(--gold-bright);border-color:var(--border-mid);transform:translateY(-1px)}
.mini-link:active{transform:scale(.95)}
.foot-note{margin-top:8px;font-size:9px;color:var(--text-muted);opacity:.8;line-height:1.4}

/* ===== VIEW / HEADERS ===== */
.view{animation:viewIn .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-primary);margin-bottom:12px}
.page-title{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;color:var(--cream);line-height:1.08;letter-spacing:-.01em;margin-bottom:10px}
.page-title em{font-style:italic;color:var(--gold-bright);font-weight:600}
.page-lead{font-size:15px;color:var(--text-primary);line-height:1.6;max-width:760px;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;margin-bottom:8px}
.page-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:34px;flex-wrap:wrap}

/* ===== BUTTONS (motion) ===== */
.btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:.02em;padding:11px 20px;border-radius:8px;border:1px solid var(--border-mid);background:var(--bg-elevated);color:var(--cream-dim);cursor:pointer;transition:transform .13s var(--ease),background .2s,box-shadow .2s,border-color .2s;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.btn:active{transform:translateY(0) scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold-primary));color:var(--bg-deep);border-color:var(--gold-primary);font-weight:700}
.btn.primary:hover{box-shadow:0 8px 24px rgba(200,161,92,.35)}
.btn.ghost{background:transparent;border-color:var(--border-soft)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:6px}
.btn .rip{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.25);pointer-events:none;animation:rip .55s var(--ease)}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.icon-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border-soft);background:var(--bg-input);color:var(--text-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s var(--ease)}
.icon-btn:hover{color:var(--gold-bright);border-color:var(--border-mid);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.9)}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:34px}
.stat{padding:20px 22px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:10px;transition:transform .2s var(--ease),border-color .2s}
.stat:hover{transform:translateY(-3px);border-color:var(--border-mid)}
.stat-num{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--gold-bright);line-height:1;letter-spacing:-.02em}
.stat-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.1em;margin-top:9px}
.stat-detail{font-size:11px;color:var(--text-muted);margin-top:5px}

/* ===== PANELS ===== */
.panel{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:12px;margin-bottom:26px;overflow:hidden}
.panel-head{padding:20px 26px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,var(--bg-elevated) 0%,var(--bg-card) 100%)}
.panel-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--cream);display:flex;align-items:center;gap:11px}
.panel-title .p-ico{font-size:17px}
.panel-sub{font-size:12px;color:var(--text-secondary);margin-top:3px;font-style:normal;font-family:'Inter'}
.panel-body{padding:8px 0}
.panel-body.pad{padding:22px 26px}

/* ===== TASK ROWS ===== */
.task{display:flex;align-items:flex-start;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border-soft);transition:background .15s;position:relative;animation:taskIn .3s var(--ease)}
@keyframes taskIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.task:last-child{border-bottom:none}
.task:hover{background:var(--bg-elevated)}
.task:hover .task-actions{opacity:1}
.task.done{opacity:.5}
.task.done .t-title{text-decoration:line-through;color:var(--text-muted)}
.checkbox{width:19px;height:19px;border:1.5px solid var(--border-strong);border-radius:5px;background:var(--bg-input);cursor:pointer;flex-shrink:0;margin-top:2px;position:relative;transition:all .18s var(--ease)}
.checkbox:hover{border-color:var(--gold-primary);transform:scale(1.12)}
.checkbox.done{background:var(--gold-primary);border-color:var(--gold-primary)}
.checkbox.done::after{content:'';position:absolute;top:1px;left:6px;width:5px;height:10px;border:solid var(--bg-deep);border-width:0 2px 2px 0;transform:rotate(45deg);animation:chk .25s var(--ease)}
@keyframes chk{from{height:0;opacity:0}to{height:10px;opacity:1}}
.t-body{flex:1;min-width:0}
.t-title{font-size:14px;font-weight:500;color:var(--cream-dim);line-height:1.45;margin-bottom:3px}
.t-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}
.t-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.task-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s;flex-shrink:0}
.mini-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border-soft);background:var(--bg-input);color:var(--text-secondary);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s var(--ease)}
.mini-btn:hover{color:var(--gold-bright);border-color:var(--border-mid);transform:translateY(-1px)}
.mini-btn.del:hover{color:var(--accent-red);border-color:var(--accent-red)}

.pill{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:4px;white-space:nowrap}
.pill.urgent{background:rgba(165,72,50,.15);color:var(--accent-red);border:1px solid rgba(165,72,50,.4)}
.pill.high{background:rgba(192,120,80,.15);color:var(--accent-orange);border:1px solid rgba(192,120,80,.4)}
.pill.mid{background:rgba(200,161,92,.12);color:var(--gold-primary);border:1px solid rgba(200,161,92,.3)}
.pill.low{background:rgba(160,133,96,.12);color:var(--text-secondary);border:1px solid var(--border-mid)}
.pill.dep{background:rgba(74,112,144,.15);color:var(--accent-blue);border:1px solid rgba(74,112,144,.35)}
.pill.done{background:rgba(106,138,80,.15);color:var(--accent-green);border:1px solid rgba(106,138,80,.4)}
.pill.scope{background:var(--bg-input);color:var(--gold-primary);border:1px solid var(--border-mid)}
.pill.date{background:rgba(74,112,144,.12);color:var(--accent-blue);border:1px solid rgba(74,112,144,.3)}
.pill.who{background:var(--bg-input);color:var(--text-secondary);border:1px solid var(--border-soft)}
.pill.routine{background:rgba(106,138,80,.12);color:var(--accent-green);border:1px solid rgba(106,138,80,.35)}
.pill.fw{background:transparent;color:var(--gold-dim);border:1px solid var(--gold-dim);text-transform:none;letter-spacing:.02em;font-weight:600;vertical-align:middle}

.empty{padding:40px 26px;text-align:center;color:var(--text-muted);font-size:13px;font-style:italic;font-family:'Playfair Display',serif}
.empty .big{font-size:30px;display:block;margin-bottom:10px;opacity:.5}

/* progress */
.obj-progress{display:flex;align-items:center;gap:14px;margin-top:14px}
.progress-bar{flex:1;height:5px;background:var(--bg-input);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright));border-radius:3px;transition:width .6s var(--ease)}
.progress-text{font-size:11px;color:var(--text-secondary);font-weight:600;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.progress-text strong{color:var(--gold-bright);font-weight:700}

/* objective header card */
.obj-hero{background:linear-gradient(135deg,var(--bg-elevated) 0%,var(--bg-card) 100%);border:1px solid var(--border-mid);border-radius:12px;padding:26px 30px;margin-bottom:24px;display:flex;gap:24px;align-items:flex-start}
.obj-num{font-family:'Playfair Display',serif;font-size:52px;font-weight:700;color:var(--gold-primary);line-height:1;font-style:italic;flex-shrink:0;min-width:64px}
.obj-tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-primary);padding:5px 12px;border:1px solid var(--gold-dim);border-radius:4px;background:var(--bg-input);white-space:nowrap}

/* ===== OBJETIVO 1 · CAMADAS ===== */
.o1-filter{display:flex;flex-wrap:wrap;gap:8px}
.fchip{font-size:11px;font-weight:700;letter-spacing:.04em;padding:7px 14px;border-radius:20px;border:1px solid var(--border-soft);background:var(--bg-input);color:var(--text-secondary);cursor:pointer;transition:all .15s var(--ease);user-select:none}
.fchip:hover{transform:translateY(-1px);border-color:var(--border-mid);color:var(--cream-dim)}
.fchip.on{background:linear-gradient(135deg,var(--gold-bright),var(--gold-primary));color:var(--bg-deep);border-color:var(--gold-primary)}
.camada-block{margin-bottom:28px}
.camada-head{display:flex;align-items:baseline;gap:14px;margin:0 0 5px;flex-wrap:wrap}
.camada-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--gold-bright);letter-spacing:-.01em}
.camada-title .cn{color:var(--gold-primary);font-style:italic;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.camada-prog{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.camada-line{height:1px;background:linear-gradient(90deg,var(--gold-dim),transparent 70%);margin:0 0 6px}
/* seção estruturar */
.estruturar{background:var(--bg-deep);border:1px solid var(--border-soft);border-top:2px dashed var(--gold-primary);border-radius:2px 2px 12px 12px;padding:22px 0 8px;margin-top:14px;overflow:hidden}
.estruturar-head{padding:0 26px 10px}
.estruturar-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--cream)}
.estruturar-title em{font-style:italic;color:var(--gold-bright);font-weight:600}
.estruturar-sub{font-size:12.5px;color:var(--text-secondary);font-style:italic;font-family:'Playfair Display',serif;margin-top:3px}

/* ===== ROUTINE ===== */
.rot-item{display:flex;align-items:center;gap:14px;padding:13px 26px;border-bottom:1px solid var(--border-soft);transition:background .15s}
.rot-item:hover{background:var(--bg-elevated)}
.rot-item:last-child{border-bottom:none}
.rot-days{display:flex;gap:4px;flex-wrap:wrap}
.rot-day{font-size:10px;font-weight:700;width:24px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-input);color:var(--text-muted);border:1px solid var(--border-soft);cursor:pointer;transition:all .15s var(--ease);user-select:none}
.rot-day.on{background:var(--gold-primary);color:var(--bg-deep);border-color:var(--gold-primary)}
.rot-day.pick:hover{transform:scale(1.1);border-color:var(--gold-primary)}

/* weekly routine table (calendário de rotinas) */
.rweek{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rweek-day{background:var(--bg-input);border:1px solid var(--border-soft);border-radius:9px;padding:10px 9px;min-height:110px;display:flex;flex-direction:column;gap:6px;transition:border-color .16s}
.rweek-day.today{border-color:var(--gold-primary);background:linear-gradient(135deg,var(--bg-elevated),var(--bg-input))}
.rweek-dow{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);padding-bottom:6px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:baseline}
.rweek-day.today .rweek-dow{color:var(--gold-bright)}
.rweek-dow .rw-date{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--cream-dim);font-variant-numeric:tabular-nums}
.rchip{display:flex;align-items:flex-start;gap:7px;font-size:11px;line-height:1.35;color:var(--cream-dim);background:var(--bg-main);border:1px solid var(--border-soft);border-left:2px solid var(--accent-green);border-radius:5px;padding:6px 8px;cursor:pointer;transition:all .14s var(--ease)}
.rchip:hover{transform:translateX(2px);border-color:var(--border-mid)}
.rchip.done{opacity:.5;text-decoration:line-through}
.rchip-box{width:13px;height:13px;border:1.5px solid var(--border-strong);border-radius:3px;flex-shrink:0;margin-top:1px;position:relative;transition:all .15s}
.rchip.done .rchip-box{background:var(--accent-green);border-color:var(--accent-green)}
.rchip.done .rchip-box::after{content:'';position:absolute;top:0;left:4px;width:3px;height:7px;border:solid var(--bg-deep);border-width:0 2px 2px 0;transform:rotate(45deg)}
.rweek-none{font-size:10px;color:var(--text-muted);font-style:italic;margin:auto 0}
@media (max-width:1000px){.rweek{grid-template-columns:repeat(2,1fr)}.rweek-day{min-height:auto}}

/* ===== CALENDAR ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--cream);text-transform:capitalize}
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-dow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);text-align:center;padding-bottom:6px}
.cal-cell{min-height:92px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:9px;padding:8px 9px;cursor:pointer;transition:all .16s var(--ease);position:relative;display:flex;flex-direction:column;gap:4px}
.cal-cell:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cal-cell.other{opacity:.35}
.cal-cell.today{border-color:var(--gold-primary);background:linear-gradient(135deg,var(--bg-elevated),var(--bg-card))}
.cal-cell.today .cal-num{color:var(--gold-bright)}
.cal-num{font-size:13px;font-weight:600;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.cal-ev{font-size:10px;line-height:1.3;padding:3px 6px;border-radius:4px;background:var(--bg-input);color:var(--cream-dim);border-left:2px solid var(--gold-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:transform .12s}
.cal-ev:hover{transform:translateX(2px)}
.cal-ev.done{opacity:.45;text-decoration:line-through;border-left-color:var(--accent-green)}
.cal-ev.u{border-left-color:var(--accent-red)}
.cal-more{font-size:9px;color:var(--text-muted);padding-left:2px}
.cal-add-hint{position:absolute;top:6px;right:8px;font-size:14px;color:var(--gold-primary);opacity:0;transition:opacity .15s}
.cal-cell:hover .cal-add-hint{opacity:.9}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(10,6,4,.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-card);border:1px solid var(--border-mid);border-radius:14px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:modalIn .32s var(--ease);overflow:hidden}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.modal-head{padding:22px 28px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--bg-elevated),var(--bg-card))}
.modal-head h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:var(--cream)}
.modal-body{padding:24px 28px}
.modal-foot{padding:18px 28px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:12px;background:var(--bg-input)}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px}
.field input[type=text],.field textarea,.field select,.field input[type=date]{width:100%;background:var(--bg-input);border:1px solid var(--border-mid);border-radius:8px;padding:11px 14px;color:var(--cream-dim);font-family:'Inter';font-size:14px;transition:border-color .18s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold-primary)}
.field textarea{resize:vertical;min-height:66px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* scope selector (req 6) */
.scope-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.scope-opt{padding:13px 15px;border:1.5px solid var(--border-soft);border-radius:9px;background:var(--bg-input);cursor:pointer;transition:all .16s var(--ease);display:flex;gap:11px;align-items:flex-start}
.scope-opt:hover{border-color:var(--border-mid);transform:translateY(-1px)}
.scope-opt.on{border-color:var(--gold-primary);background:linear-gradient(135deg,var(--bg-elevated),var(--bg-input))}
.scope-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:2px;position:relative;transition:all .15s}
.scope-opt.on .scope-radio{border-color:var(--gold-primary)}
.scope-opt.on .scope-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--gold-primary)}
.scope-opt .so-title{font-size:12.5px;font-weight:600;color:var(--cream-dim);line-height:1.25}
.scope-opt .so-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px}
.prio-grid{display:flex;gap:8px;flex-wrap:wrap}
.prio-opt{padding:8px 14px;border-radius:7px;border:1.5px solid var(--border-soft);background:var(--bg-input);cursor:pointer;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:all .15s var(--ease);color:var(--text-secondary)}
.prio-opt:hover{transform:translateY(-1px)}
.prio-opt.on{border-color:currentColor}
.prio-opt[data-p=urgent].on{color:var(--accent-red);background:rgba(165,72,50,.12)}
.prio-opt[data-p=high].on{color:var(--accent-orange);background:rgba(192,120,80,.12)}
.prio-opt[data-p=mid].on{color:var(--gold-primary);background:rgba(200,161,92,.12)}
.prio-opt[data-p=low].on{color:var(--text-secondary);background:rgba(160,133,96,.12)}

/* google agenda toggle */
.gcal-ask{display:flex;align-items:center;gap:14px;padding:15px 17px;border:1.5px solid var(--border-soft);border-radius:10px;background:var(--bg-input);cursor:pointer;transition:all .18s var(--ease)}
.gcal-ask:hover{border-color:var(--border-mid)}
.gcal-ask.on{border-color:var(--gold-primary);background:linear-gradient(135deg,var(--bg-elevated),var(--bg-input))}
.gcal-ask .ga-ico{font-size:20px;flex-shrink:0}
.gcal-ask .ga-txt{flex:1;min-width:0}
.gcal-ask .ga-title{font-size:13px;font-weight:600;color:var(--cream-dim)}
.gcal-ask .ga-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.switch{width:44px;height:24px;border-radius:13px;background:var(--bg-main);border:1px solid var(--border-mid);flex-shrink:0;position:relative;transition:all .2s var(--ease)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-muted);transition:all .22s var(--ease)}
.gcal-ask.on .switch{background:var(--gold-primary);border-color:var(--gold-primary)}
.gcal-ask.on .switch::after{left:22px;background:var(--bg-deep)}

/* ===== TOAST ===== */
.toast-wrap{position:fixed;bottom:26px;right:26px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--bg-elevated);border:1px solid var(--border-mid);border-left:3px solid var(--gold-primary);border-radius:9px;padding:14px 20px;min-width:260px;box-shadow:0 12px 36px rgba(0,0,0,.5);animation:toastIn .35s var(--ease);font-size:13px;color:var(--cream-dim);display:flex;gap:10px;align-items:center}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast.ok{border-left-color:var(--accent-green)}
.toast.info{border-left-color:var(--accent-blue)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

.banner{background:linear-gradient(135deg,var(--bg-elevated),var(--bg-card));border:1px solid var(--border-mid);border-left:3px solid var(--gold-primary);border-radius:10px;padding:16px 22px;margin-bottom:26px;display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--cream-dim)}
.banner b{color:var(--gold-bright);font-weight:700}

.pattern-bar{height:26px;background-image:repeating-linear-gradient(90deg,transparent 0 8px,var(--gold-dim) 8px 10px,transparent 10px 24px,var(--accent-red) 24px 28px,transparent 28px 40px);opacity:.2;margin-top:50px;border-radius:2px}

/* responsive */
@media (max-width:1000px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;gap:4px;padding:16px}
  .side-meta,.nav-label,.side-foot{display:none}
  .brand{width:100%}
  .nav-item{flex:1;min-width:120px}
  .main{padding:24px 20px 80px}
  .stats{grid-template-columns:1fr 1fr}
  .page-title{font-size:32px}
  .field-row{grid-template-columns:1fr}
  .cal-cell{min-height:70px}
  .cal-ev{display:none}
  .scope-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- STATE ---------- */
const STORE_KEY='cafe_tarefas_v3';
function uid(){return 't'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
let state=load();
function load(){
  let s;
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){s=JSON.parse(raw);s.tarefas=s.tarefas||[];s.rotinas=s.rotinas||[];s.rotinaCheck=s.rotinaCheck||{};s.config=s.config||{gcalUrl:''};
    // migração: garante os campos novos em tarefas antigas
    s.tarefas.forEach(t=>{if(t.camada===undefined)t.camada=null;if(t.framework===undefined)t.framework=null;if(!t.tipo)t.tipo='mapear';if(t.gcal===undefined)t.gcal=false;});
  }}catch(e){s=null;}
  if(!s)s={tarefas:seedTasks(),rotinas:[],rotinaCheck:{},config:{gcalUrl:''}};
  return applyPacks(s);
}
// Anexa cada pacote apenas uma vez (registra em s.packs). Não apaga nada existente.
function applyPacks(s){
  s.packs=s.packs||[];
  let changed=false;
  Object.keys(PACKS).forEach(k=>{
    if(!s.packs.includes(k)){PACKS[k]().forEach(t=>s.tarefas.push(t));s.packs.push(k);changed=true;}
  });
  if(changed){try{localStorage.setItem(STORE_KEY,JSON.stringify(s));}catch(e){}}
  return s;
}
function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}
  catch(e){toast('⚠ Não consegui salvar neste navegador. Faça um Backup (⬇) agora para não perder dados.','info');}
  updateBadges();
}
/* ---------- SEGURANÇA DE DADOS: backup / restauração ---------- */
function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='gestor_tarefas_backup_'+todayISO()+'.json';a.click();
    toast('Backup baixado ✓ — guarde este arquivo','ok');
  }catch(e){toast('Não consegui gerar o backup','info');}
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const obj=JSON.parse(ev.target.result);
      if(!obj||!Array.isArray(obj.tarefas))throw new Error('formato');
      if(!confirm('Restaurar este backup? Isso SUBSTITUI os dados atuais ('+state.tarefas.length+' tarefas) por '+obj.tarefas.length+' tarefas do arquivo.'))return;
      state=obj;
      state.rotinas=state.rotinas||[];state.rotinaCheck=state.rotinaCheck||{};state.config=state.config||{gcalUrl:''};
      state.tarefas.forEach(t=>{if(t.camada===undefined)t.camada=null;if(t.framework===undefined)t.framework=null;if(!t.tipo)t.tipo='mapear';if(t.gcal===undefined)t.gcal=false;});
      save();render();toast('Backup restaurado ✓ ('+state.tarefas.length+' tarefas)','ok');
    }catch(err){toast('Arquivo inválido — não foi possível restaurar','info');}
  };
  reader.readAsText(file);
}

/* ---------- DATE HELPERS ---------- */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function todayISO(){const d=new Date();return isoOf(d);}
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtBR(iso){if(!iso)return'';const d=parseISO(iso);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function isoWeekNum(d){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day+3);const first=new Date(t.getFullYear(),0,4);const wk=1+Math.round(((t-first)/86400000-3+((first.getDay()+6)%7))/7);return wk;}
function weekRange(d){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(t.getDay()+6)%7;const mon=new Date(t);mon.setDate(t.getDate()-day);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return[mon,sun];}
function inCurrentWeek(iso){if(!iso)return false;const[mon,sun]=weekRange(new Date());const d=parseISO(iso);return d>=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate())&&d<=new Date(sun.getFullYear(),sun.getMonth(),sun.getDate(),23,59);}

function scopeShort(id){if(id==='semana')return'Semana';const o=OBJETIVOS.find(o=>o.id===id);return o?('Obj '+o.num):'—';}

/* =========================================================================
   WEEK TASKS (dashboard) — avulsas da semana + datadas na semana + rotinas
   ========================================================================= */
function weekTasks(){
  // Compõem o dashboard da semana:
  // 1) tarefas avulsas (escopo 'semana') sem data;
  // 2) qualquer tarefa com data nesta semana;
  // 3) URGENTES de qualquer objetivo macro que ainda não foram concluídas
  //    — ficam fixadas aqui até serem concluídas (independente de data).
  return state.tarefas.filter(t=>{
    if(t.escopo==='semana' && !t.data)return true;
    if(t.data && inCurrentWeek(t.data))return true;
    if(!t.done && t.prioridade==='urgent' && t.escopo!=='semana')return true;
    return false;
  });
}
/* Rotinas → afazeres virtuais para os dias da semana atual */
function routineInstances(){
  const[mon]=weekRange(new Date());const out=[];
  state.rotinas.filter(r=>r.ativo!==false).forEach(r=>{
    for(let i=0;i<7;i++){
      const d=new Date(mon);d.setDate(mon.getDate()+i);
      const wd=d.getDay();
      if(r.dias.includes(wd)){
        const iso=isoOf(d);const key=r.id+'|'+iso;
        out.push({rotinaId:r.id,titulo:r.titulo,desc:r.desc,iso,dow:wd,done:!!state.rotinaCheck[key],key});
      }
    }
  });
  return out.sort((a,b)=>a.iso<b.iso?-1:1);
}

/* Item 3 — Tarefas de HOJE: rotinas do dia + tarefas datadas hoje */
function dayPanel(){
  const hoje=todayISO();const d=new Date();
  const rHoje=routineInstances().filter(r=>r.iso===hoje);
  const tHoje=state.tarefas.filter(t=>t.data===hoje);
  const order={urgent:0,high:1,dep:2,mid:3,low:4};
  const pend=tHoje.filter(t=>!t.done).sort((a,b)=>(order[a.prioridade]??5)-(order[b.prioridade]??5));
  const fin=tHoje.filter(t=>t.done);
  const rot=rHoje.map(r=>`<div class="task ${r.done?'done':''}">
      <div class="checkbox ${r.done?'done':''}" data-rcheck="${r.key}"></div>
      <div class="t-body"><div class="t-title">${esc(r.titulo)}</div>${r.desc?`<div class="t-desc">${esc(r.desc)}</div>`:''}
      <div class="t-tags"><span class="pill routine">Rotina</span></div></div>
    </div>`).join('');
  const corpo=(rot+pend.map(taskRow).join('')+fin.map(taskRow).join(''))
    || '<div class="empty"><span class="big">◷</span>Nada agendado para hoje. Sem rotinas nem tarefas com data de hoje.</div>';
  return `<div class="panel">
    <div class="panel-head">
      <div><div class="panel-title"><span class="p-ico">◷</span> Tarefas de Hoje</div>
      <div class="panel-sub">${DOW[d.getDay()]}, ${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'})} · rotinas do dia + tarefas com esta data</div></div>
      <button class="btn sm primary" data-add="semana" data-today="1">+ Adicionar hoje</button>
    </div>
    <div class="panel-body">${corpo}</div>
  </div>`;
}

/* Item 2 — tabela semanal de rotinas (Seg..Dom) */
function routineWeekTable(ri){
  const[mon]=weekRange(new Date());const hoje=todayISO();
  let cells='';
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);const iso=isoOf(d);
    const doDia=ri.filter(r=>r.iso===iso);
    const chips=doDia.length?doDia.map(r=>`<div class="rchip ${r.done?'done':''}" data-rcheck="${r.key}"><span class="rchip-box"></span><span>${esc(r.titulo)}</span></div>`).join('')
      :'<div class="rweek-none">—</div>';
    cells+=`<div class="rweek-day ${iso===hoje?'today':''}">
      <div class="rweek-dow"><span>${DOW[d.getDay()]}</span><span class="rw-date">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span></div>
      ${chips}</div>`;
  }
  return `<div class="rweek">${cells}</div>`;
}

/* ---------- OBJETIVO 1 · MAPEAMENTO EM CAMADAS ---------- */
function viewObjetivo1(){
  const o=OBJETIVOS[0];
  const ts=state.tarefas.filter(t=>t.escopo==='obj1');
  const done=ts.filter(t=>t.done).length;
  const pct=ts.length?Math.round(done/ts.length*100):0;
  const order={urgent:0,high:1,dep:2,mid:3,low:4};
  const sortT=arr=>[...arr].sort((a,b)=>(a.done-b.done)||((order[a.prioridade]??5)-(order[b.prioridade]??5)));
  const isMap=t=>(t.tipo||'mapear')!=='estruturar';
  const f=obj1Filter;

  // chips de filtro
  const chips=[{id:'todas',lb:'Todas'},...CAMADAS.map(c=>({id:c.id,lb:'C'+c.n})),{id:'estruturar',lb:'Estruturar'}];
  const chipsHtml=chips.map(c=>`<div class="fchip ${f===c.id?'on':''}" data-fchip="${c.id}">${c.lb}</div>`).join('');

  const camBlock=(cid)=>{
    const cam=CAMADAS.find(c=>c.id===cid);
    const list=sortT(ts.filter(t=>isMap(t)&&t.camada===cid));
    const d=list.filter(t=>t.done).length;
    return `<div class="camada-block">
      <div class="camada-head"><div class="camada-title"><span class="cn">Camada ${cam.n}</span> · ${esc(cam.short)}</div>
        <div class="camada-prog">${d} de ${list.length} concluída${list.length===1?'':'s'}</div></div>
      <div class="camada-line"></div>
      <div class="panel" style="margin:0"><div class="panel-body">
        ${list.length?list.map(taskRow).join(''):'<div class="empty" style="padding:20px"><span class="big">＋</span>Sem tarefas nesta camada ainda.</div>'}
      </div></div>
    </div>`;
  };
  const geralList=sortT(ts.filter(t=>isMap(t)&&!t.camada));
  const geralBlock=`<div class="camada-block">
    <div class="camada-head"><div class="camada-title"><span class="cn">Geral</span> · sem camada</div>
      <div class="camada-prog">${geralList.filter(t=>t.done).length} de ${geralList.length} concluída${geralList.length===1?'':'s'}</div></div>
    <div class="camada-line"></div>
    <div class="panel" style="margin:0"><div class="panel-body">${geralList.map(taskRow).join('')}</div></div>
  </div>`;
  const est=sortT(ts.filter(t=>!isMap(t)));
  const estHtml=`<div class="estruturar">
    <div class="estruturar-head"><div class="estruturar-title">Estruturar <em>(curto prazo)</em></div>
      <div class="estruturar-sub">Ações que emergem do mapeamento e caminham em paralelo.</div></div>
    <div>${est.length?est.map(taskRow).join(''):'<div class="empty" style="padding:20px">Nenhuma ação estrutural ainda.</div>'}</div>
  </div>`;

  let sections='';
  if(f==='estruturar'){sections=estHtml;}
  else if(f!=='todas'){sections=camBlock(f);}
  else{
    if(geralList.length)sections+=geralBlock;
    sections+=CAMADAS.map(c=>camBlock(c.id)).join('');
    sections+=estHtml;
  }

  return `<div class="view">
    <div class="page-eyebrow">Objetivo Macro 01</div>
    <div class="obj-hero">
      <div class="obj-num">01</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px">
          <h1 class="page-title" style="font-size:30px;margin:0">${esc(o.titulo)}</h1>
          <span class="obj-tag">${o.periodo}</span>
        </div>
        <p style="font-size:13.5px;color:var(--text-primary);line-height:1.6;max-width:820px">${esc(o.desc)}</p>
        <div class="obj-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-text"><strong>${pct}%</strong> · ${done} de ${ts.length}</div>
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px">
      <div class="o1-filter">${chipsHtml}</div>
      <button class="btn sm primary" data-add="obj1">+ Adicionar tarefa</button>
    </div>

    ${sections}
    <div class="pattern-bar"></div>
  </div>`;
}

/* ---------- CALENDÁRIO ---------- */
function viewCalendar(){
  const y=calRef.getFullYear(),mo=calRef.getMonth();
  const first=new Date(y,mo,1);const startDow=(first.getDay());
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const gridStart=new Date(y,mo,1-startDow);
  const tIso=todayISO();
  const byDate={};state.tarefas.filter(t=>t.data).forEach(t=>{(byDate[t.data]=byDate[t.data]||[]).push(t);});
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);
    const iso=isoOf(d);const other=d.getMonth()!==mo;const evs=byDate[iso]||[];
    const shown=evs.slice(0,3).map(t=>`<div class="cal-ev ${t.done?'done':''} ${t.prioridade==='urgent'?'u':''}" data-edit="${t.id}" title="${esc(t.titulo)}">${esc(t.titulo)}</div>`).join('');
    const more=evs.length>3?`<div class="cal-more">+${evs.length-3} mais</div>`:'';
    cells+=`<div class="cal-cell ${other?'other':''} ${iso===tIso?'today':''}" data-day="${iso}">
      <span class="cal-add-hint">+</span>
      <div class="cal-num">${d.getDate()}</div>${shown}${more}</div>`;
    if(i>=34&&d.getMonth()!==mo&&d.getDate()>7)break;
  }
  const monthTasks=state.tarefas.filter(t=>t.data&&parseISO(t.data).getMonth()===mo&&parseISO(t.data).getFullYear()===y).sort((a,b)=>a.data<b.data?-1:1);
  return `<div class="view">
    <div class="page-head-row">
      <div>
        <div class="page-eyebrow">Agenda · Datas específicas</div>
        <h1 class="page-title">Calendário</h1>
        <p class="page-lead">Clique em um dia para agendar. Tarefas datadas de qualquer aba aparecem aqui — e vice-versa.</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost sm" data-ics>⬇ Exportar .ics</button>
        <button class="btn sm" data-gcal-config>⚙ Google Agenda</button>
      </div>
    </div>

    <div class="panel"><div class="panel-body pad">
      <div class="cal-head">
        <div class="cal-title">${MESES[mo]} ${y}</div>
        <div class="cal-nav">
          <button class="icon-btn" data-cal="-1">‹</button>
          <button class="btn sm ghost" data-cal="0">Hoje</button>
          <button class="icon-btn" data-cal="1">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div></div>

    <div class="panel">
      <div class="panel-head"><div class="panel-title"><span class="p-ico">📅</span> Agendado em ${MESES[mo]}</div></div>
      <div class="panel-body">
        ${monthTasks.length?monthTasks.map(taskRow).join(''):'<div class="empty"><span class="big">📅</span>Nada agendado neste mês. Clique em um dia acima para incluir.</div>'}
      </div>
    </div>
    <div class="pattern-bar"></div>
  </div>`;
}

/* =========================================================================
   WIRE EVENTS
   ========================================================================= */
function wire(){
  const m=document.getElementById('main');
  // ripple on buttons
  m.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',ripple));
  // toggle done
  m.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const t=state.tarefas.find(x=>x.id===el.dataset.toggle);if(t){t.done=!t.done;save();render();if(t.done)toast('Concluída ✓','ok');}});
  // routine check
  m.querySelectorAll('[data-rcheck]').forEach(el=>el.onclick=()=>{const k=el.dataset.rcheck;if(state.rotinaCheck[k])delete state.rotinaCheck[k];else state.rotinaCheck[k]=true;save();render();});
  // add task
  m.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>openTaskModal(null,el.dataset.add,el.dataset.today?todayISO():undefined));
  // edit / delete
  m.querySelectorAll('[data-edit]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();openTaskModal(el.dataset.edit);});
  m.querySelectorAll('[data-del]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();delTask(el.dataset.del);});
  m.querySelectorAll('[data-gcal]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();openGCal(el.dataset.gcal);});
  // routines
  m.querySelectorAll('[data-add-routine]').forEach(el=>el.onclick=()=>openRoutineModal(null));
  m.querySelectorAll('[data-edit-routine]').forEach(el=>el.onclick=()=>openRoutineModal(el.dataset.editRoutine));
  m.querySelectorAll('[data-del-routine]').forEach(el=>el.onclick=()=>{if(confirm('Excluir esta rotina?')){state.rotinas=state.rotinas.filter(r=>r.id!==el.dataset.delRoutine);save();render();toast('Rotina removida','info');}});
  // calendar
  m.querySelectorAll('[data-fchip]').forEach(el=>el.onclick=()=>{obj1Filter=el.dataset.fchip;render();window.scrollTo({top:0,behavior:'smooth'});});
  m.querySelectorAll('[data-cal]').forEach(el=>el.onclick=()=>{const v=+el.dataset.cal;if(v===0)calRef=new Date();else calRef=new Date(calRef.getFullYear(),calRef.getMonth()+v,1);render();});
  m.querySelectorAll('[data-day]').forEach(el=>el.onclick=(e)=>{if(e.target.closest('.cal-ev'))return;openTaskModal(null,'semana',el.dataset.day);});
  m.querySelectorAll('[data-ics]').forEach(el=>el.onclick=exportICS);
  m.querySelectorAll('[data-gcal-config]').forEach(el=>el.onclick=openGCalConfig);
}
function ripple(e){const b=e.currentTarget;const c=document.createElement('span');c.className='rip';const r=b.getBoundingClientRect();const s=Math.max(r.width,r.height);c.style.width=c.style.height=s+'px';c.style.left=(e.clientX-r.left-s/2)+'px';c.style.top=(e.clientY-r.top-s/2)+'px';b.appendChild(c);setTimeout(()=>c.remove(),560);}

function delTask(id){const t=state.tarefas.find(x=>x.id===id);if(!t)return;if(confirm('Excluir "'+t.titulo+'"?')){state.tarefas=state.tarefas.filter(x=>x.id!==id);save();render();toast('Tarefa excluída','info');}}

              </select>

          </div>

            <div class="ga-txt">
              <div class="ga-title">Lembrar pelo Google Agenda?</div>

      <div class="modal-foot">
        <button class="btn ghost" id="mCancel">Cancelar</button>
        <button class="btn primary" id="mSave">${editing?'Salvar':'Adicionar tarefa'}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML=html;
  const ovl=document.getElementById('ovl');
  ovl.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',ripple));
  document.getElementById('mClose').onclick=closeModal;
  document.getElementById('mCancel').onclick=closeModal;
  ovl.onclick=(e)=>{if(e.target===ovl)closeModal();};
  ovl.querySelectorAll('[data-scope]').forEach(el=>el.onclick=()=>{draft.escopo=el.dataset.scope;ovl.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('on',x.dataset.scope===draft.escopo));const o1=document.getElementById('obj1Fields');if(o1)o1.style.display=draft.escopo==='obj1'?'block':'none';});
  ovl.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{draft.prioridade=el.dataset.p;ovl.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===draft.prioridade));});
  const gAsk=document.getElementById('gcalAsk');
  gAsk.onclick=()=>{draft.gcal=!draft.gcal;gAsk.classList.toggle('on',draft.gcal);};
  setTimeout(()=>document.getElementById('fTitulo').focus(),80);
  document.getElementById('fTitulo').addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();saveTask();}});
  document.getElementById('mSave').onclick=saveTask;
}
function saveTask(){
  const titulo=document.getElementById('fTitulo').value.trim();
  if(!titulo){toast('Dê um título à tarefa','info');document.getElementById('fTitulo').focus();return;}
  const data=document.getElementById('fData').value||null;
  const desc=document.getElementById('fDesc').value.trim();
  const responsavel=document.getElementById('fResp').value;
  // Campos do Objetivo 1 (só quando escopo === 'obj1')
  const isObj1=draft.escopo==='obj1';
  const camada=isObj1?(document.getElementById('fCamada').value||null):null;
  const tipo=isObj1?(document.getElementById('fTipo').value||'mapear'):'mapear';
  const framework=isObj1?(document.getElementById('fFramework').value.trim()||null):null;
  // Lembrete Google Agenda precisa de uma data
  if(draft.gcal&&!data){toast('Escolha uma data para o lembrete do Google Agenda','info');document.getElementById('fData').focus();return;}
  let saved;
  if(draft.id){
    const t=state.tarefas.find(x=>x.id===draft.id);
    const jaLembrava=t.gcal&&t.data===data;
    Object.assign(t,{titulo,desc,prioridade:draft.prioridade,escopo:draft.escopo,data,responsavel,gcal:draft.gcal,camada,tipo,framework});
    saved=t;
    toast('Tarefa atualizada ✓','ok');
    if(draft.gcal&&data&&!jaLembrava)agendarGCal(t);
  }else{
    saved={id:uid(),titulo,desc,prioridade:draft.prioridade,escopo:draft.escopo,data,responsavel,gcal:draft.gcal,camada,tipo,framework,done:false,rotinaId:null,criadoEm:todayISO()};
    state.tarefas.push(saved);
    toast('Adicionada em '+scopeShort(draft.escopo)+(data?' · '+fmtBR(data):'')+' ✓','ok');
    if(draft.gcal&&data)agendarGCal(saved);
  }
  save();closeModal();render();
}
function closeModal(){const r=document.getElementById('modalRoot');const ovl=document.getElementById('ovl');if(ovl){ovl.style.animation='fadeIn .2s reverse';setTimeout(()=>r.innerHTML='',180);}else r.innerHTML='';}

      </div>
    </div>

  </div></div>`;
  document.getElementById('modalRoot').innerHTML=html;
  const ovl=document.getElementById('ovl');
  ovl.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',ripple));
  document.getElementById('mClose').onclick=closeModal;document.getElementById('mCancel').onclick=closeModal;
  ovl.onclick=(e)=>{if(e.target===ovl)closeModal();};

  ovl.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{const d=+el.dataset.d;if(picked.has(d))picked.delete(d);else picked.add(d);el.classList.toggle('on');});
  setTimeout(()=>document.getElementById('rTitulo').focus(),80);
  document.getElementById('mSave').onclick=()=>{
    const titulo=document.getElementById('rTitulo').value.trim();
    if(!titulo){toast('Dê um nome à rotina','info');return;}
    if(!picked.size){toast('Escolha ao menos um dia','info');return;}

    const arr=[...picked].sort();
    if(r){Object.assign(r,{titulo,desc,dias:arr});toast('Rotina atualizada ✓','ok');}
    else{state.rotinas.push({id:uid(),titulo,desc,dias:arr,ativo:true});toast('Rotina criada — já aparece no dashboard ✓','ok');}
    save();closeModal();render();
  };
}

/* =========================================================================
   GOOGLE AGENDA
   ========================================================================= */
function gcalUrl(t){
  const d=t.data.replace(/-/g,'');
  const end=parseISO(t.data);end.setDate(end.getDate()+1);const de=isoOf(end).replace(/-/g,'');
  const det=(t.desc||'')+(t.responsavel?('\nResponsável: '+t.responsavel):'')+'\n\n[Gestor de Tarefas · Controladoria Café Export]';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(t.titulo)
    +'&dates='+d+'/'+de
    +'&details='+encodeURIComponent(det);
}
function openGCal(id){const t=state.tarefas.find(x=>x.id===id);if(!t||!t.data)return;window.open(gcalUrl(t),'_blank');toast('Abrindo Google Agenda — clique em Salvar e o Google te lembra','info');}

function pad(n){return String(n).padStart(2,'0');}
function exportICS(){
  const dated=state.tarefas.filter(t=>t.data&&!t.done);
  if(!dated.length){toast('Nenhuma tarefa datada para exportar','info');return;}
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CafeExport//GestorTarefas//PT\r\nCALSCALE:GREGORIAN\r\n';
  dated.forEach(t=>{
    const d=t.data.replace(/-/g,'');
    const end=parseISO(t.data);end.setDate(end.getDate()+1);const de=isoOf(end).replace(/-/g,'');
    ics+='BEGIN:VEVENT\r\nUID:'+t.id+'@cafeexport\r\n';
    ics+='DTSTART;VALUE=DATE:'+d+'\r\nDTEND;VALUE=DATE:'+de+'\r\n';
    ics+='SUMMARY:'+t.titulo.replace(/[\r\n,;]/g,' ')+'\r\n';
    if(t.desc)ics+='DESCRIPTION:'+t.desc.replace(/[\r\n,;]/g,' ')+(t.responsavel?(' — '+t.responsavel):'')+'\r\n';
    ics+='BEGIN:VALARM\r\nACTION:DISPLAY\r\nTRIGGER:-PT10H\r\nDESCRIPTION:'+t.titulo.replace(/[\r\n,;]/g,' ')+'\r\nEND:VALARM\r\n';
    ics+='END:VEVENT\r\n';
  });
  ics+='END:VCALENDAR';
  const blob=new Blob([ics],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tarefas_cafe_export.ics';a.click();
  toast(dated.length+' tarefa(s) exportada(s) — importe no Google Agenda','ok');
}

/* Envio automático ao Apps Script (fire-and-forget, no-cors) */
function pushToGCal(t){
  if(!state.config.gcalUrl||!t.data)return;
  try{fetch(state.config.gcalUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({acao:'criarEvento',titulo:t.titulo,desc:t.desc,data:t.data,responsavel:t.responsavel})});}catch(e){}
}
/* Chamado quando a tarefa pediu lembrete: usa auto-sync se configurado,
   senão abre o Google Agenda pré-preenchido para você salvar. */
function agendarGCal(t){
  if(state.config.gcalUrl){pushToGCal(t);toast('Lembrete enviado ao seu Google Agenda ✓','ok');}
  else{setTimeout(()=>{window.open(gcalUrl(t),'_blank');},400);toast('Abrindo Google Agenda — clique em Salvar para ativar o lembrete','info');}
}

/* =========================================================================
   TOAST
   ========================================================================= */
function toast(msg,type){
  const w=document.getElementById('toastWrap');const el=document.createElement('div');el.className='toast '+(type||'');el.innerHTML=msg;w.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},3200);
}

/* =========================================================================
   CONSCIÊNCIA DE DATA — o sistema acompanha o dia real, mesmo aberto o dia todo
   ========================================================================= */
let lastDay=todayISO();
function checkDayChange(){
  const d=todayISO();
  if(d!==lastDay){
    lastDay=d;
    calRef=new Date();               // calendário volta ao mês atual
    render();                        // recomputa "hoje", semana, urgências
    toast('Virou o dia ('+fmtBR(d)+') — "Hoje", a semana e as urgências foram atualizados.','info');
  }else{
    updateBadges();                  // mantém rodapé/badges vivos
  }
}
setInterval(checkDayChange,60000);                 // checa a cada minuto
window.addEventListener('focus',checkDayChange);   // ao voltar pra aba
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDayChange();}); // ao acordar do sleep
